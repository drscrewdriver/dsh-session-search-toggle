# dsh-session-search-toggle bundle patch
#
# When installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-session-search-toggle
#
# — the command appends `dsh-session-search-toggle` to the bundle stack, and the
# profile boot merges THIS patch (a single `insert` of the plugin row).
- insert:
    - id: dsh-session-search-toggle
      name: 'dsh-session-search-toggle'
